app = "gd-gif-server"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  U2NET_HOME = "/app/data/.u2net"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "gif_data"
  destination = "/app/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
